services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  customer_app:
    build: .
    command: >
      streamlit run ui/customer_app.py
      --server.port=8501 --server.address=0.0.0.0
      --server.headless=true
    volumes:
      - netmera_storage:/app/storage/data
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent_console:
    build: .
    command: >
      streamlit run ui/agent_console.py
      --server.port=8502 --server.address=0.0.0.0
      --server.headless=true
    volumes:
      - netmera_storage:/app/storage/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  widget_api:
    build: .
    command: >
      uvicorn widget_api.main:app
      --host 0.0.0.0 --port 8000
    volumes:
      - netmera_storage:/app/storage/data
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Gomulebilir widget paketini uretir ve paylasilan volume'a birakir.
  # Uzun sureli calismaz — build edip cikar (nginx dosyalari okur).
  widget_build:
    build: ./widget
    volumes:
      - widget_dist:/out
    command: sh -c "cp -r /widget/. /out/ && echo 'widget paketi hazir'"

  # TLS sonlandirma + yonlendirme. nginx'in yerini aldi.
  caddy:
    image: caddy:2-alpine
    depends_on:
      customer_app:
        condition: service_started
      agent_console:
        condition: service_started
      widget_api:
        condition: service_started
      # Widget paketi hazir olmadan Caddy /widget/* icin 404 dondurmesin
      widget_build:
        condition: service_completed_successfully
    ports:
      - "80:80"        # HTTPS yonlendirmesi + ACME dogrulamasi
      - "443:443"
      - "443:443/udp"  # HTTP/3
      - "8082:8082"    # GECICI fallback — gecis dogrulaninca kaldirilacak
    env_file: .env     # PANEL_PASSWORD_HASH
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - widget_dist:/srv/widget:ro
      - caddy_data:/data      # SERTIFIKALAR — kalici olmak ZORUNDA
      - caddy_config:/config
    restart: unless-stopped

volumes:
  netmera_storage:
  widget_dist:
  caddy_data:
  caddy_config:
