# :80  -> customer_app, herkese acik.
# :8082 -> agent_console, HTTP Basic Auth ile korunuyor (bkz. DEPLOY.md —
#          nginx/.htpasswd olusturma adimi). Personel paneli internete
#          asla auth'suz acilmamali.

server {
    listen 80;
    server_name _;

    # Widget API — dis sitelerden CORS ile cagrilir. CORS basliklarini
    # UYGULAMA (FastAPI) uretir; nginx burada eklemez, yoksa cift baslik
    # olur ve tarayici istegi reddeder.
    location /api/widget/ {
        proxy_pass http://widget_api:8000/api/widget/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://customer_app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 8082;
    server_name _;

    auth_basic "Netmera Personel Paneli";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://agent_console:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
