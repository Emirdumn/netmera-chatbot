# :80  -> customer_app, herkese acik.
# :8082 -> agent_console, HTTP Basic Auth ile korunuyor (bkz. DEPLOY.md —
#          nginx/.htpasswd olusturma adimi). Personel paneli internete
#          asla auth'suz acilmamali.

server {
    listen 80;
    server_name _;

    # Widget API — dis sitelerden CORS ile cagrilir. CORS basliklarini
    # UYGULAMA (FastAPI) uretir; nginx burada eklemez, yoksa cift baslik
    # olur ve tarayici istegi reddeder.
    location /api/widget/ {
        proxy_pass http://widget_api:8000/api/widget/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gomulebilir widget paketi (widget.js + widget.css).
    # Statik dosyalar; dis sitelerden <script> ile cekilecegi icin CORS
    # serbest ve uzun cache. Dosyalar icerik-hash'li DEGIL, o yuzden
    # kisa cache + must-revalidate: yeni surum hizli yayilsin.
    location /widget/ {
        alias /usr/share/nginx/widget/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://customer_app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 8082;
    server_name _;

    auth_basic "Netmera Personel Paneli";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://agent_console:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
